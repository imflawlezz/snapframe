name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Run unit tests
        run: |
          ./Scripts/xcodebuild-ci.sh test \
            -project snapframe.xcodeproj \
            -scheme snapframe \
            -destination 'platform=macOS' \
            -quiet
